name: devcontainer image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'prettier.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'spark-ext/.sbtopts'
      - 'spark-ext/build.sbt'
      - 'spark-ext/dev/docker/entrypoint.sh'
      - 'spark-ext/dev/pins.env'
      - 'spark-ext/dev/targets/**'
      - 'spark-ext/project/**'
      - '.github/workflows/devcontainer-image.yaml'
  workflow_dispatch:

concurrency:
  group: devcontainer-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Use Node 24.11.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install locked tooling
        run: npm ci --no-audit --no-fund

      - name: Validate Docker
        run: ./contrib/bootstrap-ci.sh

      - name: Synchronize candidate image reference
        run: npx --no-install nx run devcontainer:tag -- --update-consumer

      - name: Build, test, and publish immutable image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install nx run devcontainer:publish

      - name: Validate headless Metals import
        run: |
          set -euo pipefail
          npx --no-install nx run devcontainer:up
          npx --no-install nx run devcontainer:exec -- \
            bash .devcontainer/scripts/validate-metals.sh

      - name: Remove headless devcontainer
        if: always()
        run: npx --no-install nx run devcontainer:down

      - name: Remove smoke containers
        if: always()
        run: npx --no-install nx run devcontainer:cleanup

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true
