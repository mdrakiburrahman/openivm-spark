name: devcontainer image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'prettier.config.mjs'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'spark-ext/.sbtopts'
      - 'spark-ext/build.sbt'
      - 'spark-ext/dev/docker/entrypoint.sh'
      - 'spark-ext/dev/pins.env'
      - 'spark-ext/dev/targets/**'
      - 'spark-ext/project/**'
      - '.github/workflows/devcontainer-image.yaml'
      - '.github/scripts/stage-pr62-image-input.sh'
  workflow_dispatch:
    inputs:
      assembly_asset_id:
        description: Optional numeric same-repository draft asset ID for verified PR62 packaging only
        type: string
        required: false
      assembly_sha256:
        description: Exact SHA256 of the existing immutable PR62 assembly
        type: string
        required: false
        default: a49fe6c36626853a672f7a4d43250b7e798d01814b3b98b40c8e8885ec0286eb

concurrency:
  group: devcontainer-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stage-prebuilt:
    if: github.repository == 'mdrakiburrahman/openivm-spark' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/copilot/pr62-spark35-artifact-20261103' && inputs.assembly_asset_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download and verify trusted draft input without checkout
        env:
          ASSEMBLY_ASSET_ID: ${{ inputs.assembly_asset_id }}
          ASSEMBLY_SHA256: ${{ inputs.assembly_sha256 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          readonly sha=a49fe6c36626853a672f7a4d43250b7e798d01814b3b98b40c8e8885ec0286eb
          if [[ ! "$ASSEMBLY_ASSET_ID" =~ ^[0-9]+$ || "$ASSEMBLY_SHA256" != "$sha" ]]; then
            echo "Numeric asset ID and exact pinned PR62 SHA256 are required." >&2
            exit 2
          fi
          context="${RUNNER_TEMP}/pr62-assembly"
          mkdir "$context"
          printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/octet-stream"\n' \
            "$GITHUB_TOKEN" |
            curl --config - --fail --silent --show-error --location \
              --output "$context/ivmextension.jar" \
              "https://api.github.com/repos/mdrakiburrahman/openivm-spark/releases/assets/${ASSEMBLY_ASSET_ID}"
          test "$(stat --format=%s "$context/ivmextension.jar")" = 100880999
          printf '%s  %s\n' "$sha" "$context/ivmextension.jar" | sha256sum -c -

      - name: Transfer verified immutable input within this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr62-verified-build-input
          path: ${{ runner.temp }}/pr62-assembly/ivmextension.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  image:
    needs: stage-prebuilt
    if: always() && (needs.stage-prebuilt.result == 'success' || (needs.stage-prebuilt.result == 'skipped' && inputs.assembly_asset_id == ''))
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Use Node 24.11.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.11.1
          cache: npm

      - name: Install locked tooling
        run: npm ci --no-audit --no-fund

      - name: Validate Docker
        run: ./contrib/bootstrap-ci.sh

      - name: Receive same-run verified PR62 input
        if: github.event_name == 'workflow_dispatch' && inputs.assembly_asset_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr62-verified-build-input
          path: ${{ runner.temp }}/pr62-assembly

      - name: Reverify prebuilt identity and select packaging only
        if: github.event_name == 'workflow_dispatch' && inputs.assembly_asset_id != ''
        env:
          ASSEMBLY_SHA256: ${{ inputs.assembly_sha256 }}
        run: |
          set -euo pipefail
          readonly sha=a49fe6c36626853a672f7a4d43250b7e798d01814b3b98b40c8e8885ec0286eb
          test "$ASSEMBLY_SHA256" = "$sha"
          context="${RUNNER_TEMP}/pr62-assembly"
          test "$(stat --format=%s "$context/ivmextension.jar")" = 100880999
          printf '%s  %s\n' "$sha" "$context/ivmextension.jar" | sha256sum -c -
          printf 'OPENIVM_PR62_ASSEMBLY_DIR=%s\nOPENIVM_IMAGE_BUILD_TARGET=pr62-control-runtime\n' "$context" >> "$GITHUB_ENV"

      - name: Synchronize candidate image reference
        run: npx --no-install nx run devcontainer:tag -- --update-consumer

      - name: Build, test, and publish immutable image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install nx run devcontainer:publish

      - name: Validate headless Metals import
        run: |
          set -euo pipefail
          npx --no-install nx run devcontainer:up
          npx --no-install nx run devcontainer:exec -- \
            bash .devcontainer/scripts/validate-metals.sh

      - name: Remove headless devcontainer
        if: always()
        run: npx --no-install nx run devcontainer:down

      - name: Remove smoke containers
        if: always()
        run: npx --no-install nx run devcontainer:cleanup

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io || true
