name: gci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight gci run for the same PR when a new commit lands.
concurrency:
  group: gci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: dev.sh verify (self-hosted openivm-spark-azure)
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 350  # under GitHub's 6-hour hard limit

    env:
      # 48-vCPU self-hosted runner (Standard_E48as_v5) — 1 fork per 2 vCPU
      # per the published recommendation in spark-ext/dev/dev.sh.
      OPENIVM_TEST_FORKS: "24"

    steps:
      - name: Reclaim workspace from root-owned Docker artifacts (self-hosted)
        # dev.sh verify runs Docker containers (as root) that bind-mount the
        # repo read-write and create target/ + global-logging files owned by
        # root. On this persistent self-hosted runner a cancelled or failed
        # prior run (concurrency: cancel-in-progress) leaves those root-owned
        # files behind, and the next actions/checkout's `git clean -ffdx` /
        # rmdir runs as the unprivileged runner user and dies with EACCES (e.g.
        # spark-ext/target/global-logging). Reclaim ownership first so checkout
        # can always reset the workspace. Best-effort; this step never fails.
        shell: bash
        run: |
          set -uo pipefail
          ws="${GITHUB_WORKSPACE:-$PWD}"
          [ -d "$ws" ] || exit 0
          if sudo -n true 2>/dev/null; then
            sudo chown -R "$(id -u):$(id -g)" "$ws" || true
          else
            docker run --rm -v "$ws:/ws" alpine:3 \
              chown -R "$(id -u):$(id -g)" /ws || true
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # pins-sync runs `git merge-base --is-ancestor` against pinned
          # commits, so we need the full graph (not a shallow clone).
          fetch-depth: 0

      - name: Bootstrap CI host (jq + docker + daemon config)
        run: ./contrib/bootstrap-ci.sh

      - name: Show host capacity
        run: |
          echo "── cpu ─────────────────────────────"
          nproc
          echo "── memory ──────────────────────────"
          free -h
          echo "── disk ────────────────────────────"
          df -h /

      - name: dev.sh verify (lint + compile + assembly + all suites)
        run: ./spark-ext/dev/dev.sh verify -Dopenivm.test.forks=${OPENIVM_TEST_FORKS}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_id }}
          path: .logs/
          if-no-files-found: ignore
          retention-days: 14
