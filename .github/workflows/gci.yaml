name: gci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended_tpcds_sf1:
        description: Run the isolated Extended TPC-DS SF1 Spark candidate experiment
        type: boolean
        default: false
      monthly_precision_only:
        description: Run only focused decimal monthly parity checks on a hosted runner
        type: boolean
        default: false
      monthly_snapshot_probe:
        description: Diagnose only the SF1 monthly snapshot and its ancestors
        type: boolean
        default: false
      runner_capacity_probe:
        description: Inspect hosted memory and scratch capacity
        type: boolean
        default: false

concurrency:
  group: gci-${{ github.ref }}${{ inputs.runner_capacity_probe && '-capacity' || inputs.monthly_precision_only && '-monthly-precision' || inputs.monthly_snapshot_probe && '-monthly-probe' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-capacity:
    if: github.event_name == 'workflow_dispatch' && inputs.runner_capacity_probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect hosted resources
        run: |
          df -hT
          free -m
          lsblk

  verify:
    if: ${{ !inputs.extended_tpcds_sf1 && !inputs.monthly_precision_only && !inputs.monthly_snapshot_probe && !inputs.runner_capacity_probe }}
    name: Nx verify (${{ matrix.target }})
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 350
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:d1c83bb1b2a7506880df8c48bf3822ec4c3389858b975345bb8f2f3ee0b7fc32
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [spark-3.5, spark-4.1]
    env:
      NX_DAEMON: 'false'
      OPENIVM_TEST_FORKS: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify
        run: >-
          npx --no-install nx run spark-ext:verify
          --configuration=${{ matrix.target }}
          -- -Dopenivm.test.forks=${OPENIVM_TEST_FORKS}

      - name: Window net-zero probe
        run: >-
          npx --no-install nx run spark-ext:window-benchmark
          --configuration=${{ matrix.target }}

      - name: Upload test inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-inventory-${{ matrix.target }}-${{ github.run_id }}
          path: spark-ext/target/test-inventory/${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.target }}-${{ github.run_id }}
          path: .logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  compare-test-inventory:
    name: Identical test inventory
    needs: verify
    runs-on: [self-hosted, openivm-spark-azure]
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:d1c83bb1b2a7506880df8c48bf3822ec4c3389858b975345bb8f2f3ee0b7fc32
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download test inventories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-inventory-*-${{ github.run_id }}
          path: spark-ext/target/test-inventory
          merge-multiple: true

      - name: Compare discovered tests
        run: npx --no-install nx run spark-ext:compare-test-inventory

  extended-tpcds-sf1:
    if: github.event_name == 'workflow_dispatch' && (inputs.extended_tpcds_sf1 || inputs.monthly_precision_only || inputs.monthly_snapshot_probe)
    name: ${{ inputs.monthly_precision_only && 'Monthly decimal parity (Spark 3.5 + 4.1)' || inputs.monthly_snapshot_probe && 'SF1 monthly snapshot diagnostics' || 'Extended TPC-DS SF1 candidate (Spark 4.1)' }}
    runs-on: ${{ (inputs.monthly_precision_only || inputs.monthly_snapshot_probe) && 'ubuntu-latest' || fromJSON('["self-hosted","openivm-spark-azure"]') }}
    timeout-minutes: ${{ inputs.monthly_precision_only && 45 || inputs.monthly_snapshot_probe && 180 || 480 }}
    permissions:
      contents: read
      actions: read
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:d1c83bb1b2a7506880df8c48bf3822ec4c3389858b975345bb8f2f3ee0b7fc32
      options: ${{ inputs.monthly_precision_only && '--user=0:0 --cpus=4 --memory=8g --memory-swap=8g' || inputs.monthly_snapshot_probe && '--user=0:0 --cpus=4 --memory=14g --memory-swap=14g' || '--cpus=8 --memory=32g --memory-swap=32g' }}
    defaults:
      run:
        shell: bash
    env:
      NX_DAEMON: 'false'
      OPENIVM_SPARK_TARGET: spark-4.1
      JAVA_HOME: /opt/java/jdk-21
      OPENIVM_SBT_OPTS: -Xmx4G -XX:ActiveProcessorCount=8 -Dsbt.task.cpus=8 -Dsbt.supershell=false
      PYTHONPATH: ${{ github.workspace }}/candidate-python
      EXTENDED_TPCDS_BENCHMARK_COMMIT: ${{ inputs.monthly_snapshot_probe && 'aa44dc36c15a5f25d97b889a3ad408debbef1c77' || '34cc4700b1fb18a605572bd26a0ce52868d36fae' }}
    steps:
      - name: Retain completed SF1 inputs before checkout
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          current = Path('sf1-results')
          metadata = current/'provenance.json'
          manifest = current/'prepared/plan/manifest.json'
          retained = Path.cwd().parent/'extended-tpcds-retained'
          if metadata.is_file() and manifest.is_file() and not retained.exists():
              previous = json.loads(metadata.read_text())
              plan = json.loads(manifest.read_text())
              if (previous.get('benchmark_commit') == os.environ['EXTENDED_TPCDS_BENCHMARK_COMMIT']
                      and plan.get('plan_id') == '24fdc6d2172de3a9'
                      and (current/'reference/batch1/int_engagement_status_transaction.parquet').is_file()
                      and (current/'reference/batch1/fact_engagement_status_monthly_snapshot.parquet').is_file()):
                  current.rename(retained)
                  print('Retained completed SF1 source plan and reference snapshots')
          PY
      - name: Checkout candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Checkout benchmark source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: mdrakiburrahman/ivm-bench
          ref: ${{ env.EXTENDED_TPCDS_BENCHMARK_COMMIT }}
          path: benchmark-source
          persist-credentials: false

      - name: Download exact native candidate CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          repository: ila/openivm
          run-id: 39226213916
          name: openivm-v1.5.4-extension-linux_amd64
          path: candidate-native
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare isolated candidate compiler and Python dependencies
        run: |
          set -euo pipefail
          echo 'ce6cccb23bd04b579bc8e019608c36f52e6bd8cc7b5f5d8a1aac88d7a65d84f1  candidate-native/openivm.duckdb_extension' | sha256sum -c -
          curl --fail --location --retry 3 --max-time 120 https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip -o candidate-native/duckdb.zip
          echo '1f2fa724fb054b3dbe1a9cbd13de5b76997d850e7087ec762ba88db04e0180cf  candidate-native/duckdb.zip' | sha256sum -c -
          unzip -q candidate-native/duckdb.zip -d candidate-native
          chmod +x candidate-native/duckdb
          python3 -m pip install --target candidate-python duckdb==1.2.1 sqlglot==30.23.0
          curl --fail --location --retry 3 --max-time 120 https://extensions.duckdb.org/v1.5.4/linux_amd64/icu.duckdb_extension.gz -o candidate-native/icu.duckdb_extension.gz
          gzip -d candidate-native/icu.duckdb_extension.gz
          platform="$(python3 -c "import duckdb; print(duckdb.sql('PRAGMA platform').fetchone()[0])")"
          mkdir -p "candidate-native/extensions/v1.2.1/$platform"
          curl --fail --location --retry 3 --max-time 120 "https://extensions.duckdb.org/v1.2.1/$platform/tpcds.duckdb_extension.gz" -o "candidate-native/extensions/v1.2.1/$platform/tpcds.duckdb_extension.gz"
          gzip -d "candidate-native/extensions/v1.2.1/$platform/tpcds.duckdb_extension.gz"
          python3 - <<'PY'
          from pathlib import Path
          native = Path('candidate-native').resolve()
          (native/'init.sql').write_text("LOAD json; LOAD '" + str(native/'icu.duckdb_extension') + "'; SET TimeZone='UTC'; SET threads=4; SET memory_limit='2GB'; SET max_temp_directory_size='8GB'; LOAD '" + str(native/'openivm.duckdb_extension') + "';\n")
          PY
          candidate-native/duckdb -unsigned -init candidate-native/init.sql -c "SELECT version(); SELECT extension_name,extension_version FROM duckdb_extensions() WHERE loaded;" > candidate-native/versions.txt
          cat candidate-native/versions.txt
          sha256sum candidate-native/duckdb candidate-native/openivm.duckdb_extension > candidate-native/SHA256SUMS

      - name: Build candidate Spark classes using locked tooling
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit --no-fund
          npx --no-install nx run spark-ext:build --configuration=spark-4.1 -- 'export ivmExtension / Compile / fullClasspath' | tee sf1-build.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('sf1-build.log').read_text().splitlines()
          paths = [line.strip() for line in lines if line.startswith('/') and ':' in line and '.jar' in line]
          if len(paths) != 1:
              raise RuntimeError('Could not identify the exported runtime classpath')
          Path('spark-classpath.txt').write_text(paths[0])
          PY
          "$JAVA_HOME/bin/javac" -proc:none -cp "$(cat spark-classpath.txt)" contrib/extended-tpcds/ExtendedTpcdsSpark.java

      - name: Check null-padded duplicates in both Spark targets
        if: ${{ !inputs.monthly_snapshot_probe }}
        env:
          OPENIVM_TEST_FORKS: '1'
        run: |
          set -euo pipefail
          export OPENIVM_CLI_PATH="$GITHUB_WORKSPACE/contrib/extended-tpcds/compiler-adapter.py"
          export OPENIVM_EXTENSION_PATH="$GITHUB_WORKSPACE/candidate-native/openivm.duckdb_extension"
          export EXTENDED_TPCDS_NATIVE_CLI="$GITHUB_WORKSPACE/candidate-native/duckdb"
          export EXTENDED_TPCDS_COMPILER_INIT="$GITHUB_WORKSPACE/candidate-native/init.sql"
          export OPENIVM_SBT_OPTS='-Xmx1536m -XX:ActiveProcessorCount=4 -Dsbt.task.cpus=4 -Dsbt.supershell=false'
          npx --no-install nx run spark-ext:test --configuration=spark-4.1 -- \
            'ivmCompiler/scalafmt' 'ivmCompiler/Test/scalafmt' 'ivmExtension/scalafmt' 'ivmIt/Test/scalafmt' \
            'ivmCompiler/testOnly org.openivm.spark.compiler.OpenIvmCompilerSpec -- -z "native"' \
            'set ivmIt / Test / javaOptions += "-Dopenivm.golden.print=true"' \
            'ivmIt/testOnly org.openivm.spark.parity.SimpleProjectionOuterJoinSpec org.openivm.spark.parity.SimpleProjectionOuterJoinCdfSpec org.openivm.spark.parity.RefreshTypeGoldenSpec'
          npx --no-install nx run spark-ext:test --configuration=spark-3.5 -- \
            'ivmIt/testOnly org.openivm.spark.parity.SimpleProjectionOuterJoinSpec org.openivm.spark.parity.SimpleProjectionOuterJoinCdfSpec'

      - name: Generate SF1 data, build independent references, run Spark
        if: ${{ !inputs.monthly_precision_only }}
        env:
          EXTENDED_TPCDS_MONTHLY_PROBE: ${{ inputs.monthly_snapshot_probe && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 -u contrib/extended-tpcds/run.py 2>&1 | tee sf1-worker.log

      - name: Upload SF1 results and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extended-tpcds-spark-${{ inputs.monthly_precision_only && 'monthly-parity' || inputs.monthly_snapshot_probe && 'monthly-probe' || 'sf1' }}-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            sf1-worker.log
            sf1-build.log
            candidate-native/versions.txt
            candidate-native/SHA256SUMS
            sf1-results/*.json
            sf1-results/compiler-trace/
            sf1-results/compile-failures/
            spark-ext/ivm-it/src/test/scala/org/openivm/spark/parity/WindowPartitionScenarios.scala
            spark-ext/ivm-compiler/src/main/scala/org/openivm/spark/compiler/OpenIvmCompiler.scala
            spark-ext/ivm-compiler/src/main/scala/org/openivm/spark/compiler/SparkFunctionShimSql.scala
            spark-ext/ivm-compiler/src/test/scala/org/openivm/spark/compiler/OpenIvmCompilerSpec.scala
            spark-ext/ivm-extension/src/main/scala/org/openivm/spark/commands/MaterializedViewCommands.scala
            spark-ext/ivm-it/src/test/scala/org/openivm/spark/parity/RefreshTypeGoldenSpec.scala
            .logs/
