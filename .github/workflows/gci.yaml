name: gci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Nx verify (${{ matrix.target }})
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 350
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:6314c87a6da3f303b524e4421b4a21779b6af7224f34911a349141b846f6180f
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [spark-3.5, spark-4.1]
    env:
      NX_DAEMON: 'false'
      OPENIVM_TEST_FORKS: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify
        run: >-
          npx --no-install nx run spark-ext:verify
          --configuration=${{ matrix.target }}
          -- -Dopenivm.test.forks=${OPENIVM_TEST_FORKS}

      - name: Window net-zero probe
        run: >-
          npx --no-install nx run spark-ext:window-benchmark
          --configuration=${{ matrix.target }}

      - name: Upload test inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-inventory-${{ matrix.target }}-${{ github.run_id }}
          path: spark-ext/target/test-inventory/${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-${{ matrix.target }}-${{ github.run_id }}
          path: .logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  compare-test-inventory:
    name: Identical test inventory
    needs: verify
    runs-on: [self-hosted, openivm-spark-azure]
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:6314c87a6da3f303b524e4421b4a21779b6af7224f34911a349141b846f6180f
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download test inventories
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: test-inventory-*-${{ github.run_id }}
          path: spark-ext/target/test-inventory
          merge-multiple: true

      - name: Compare discovered tests
        run: npx --no-install nx run spark-ext:compare-test-inventory
