name: gci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Nx verify (${{ matrix.target }})
    runs-on: [self-hosted, openivm-spark-azure]
    timeout-minutes: 350
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:a9bc450e13285b21bb49e973d954538a0fdbe8987ecf2e35cd7c4b60726348bf
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [spark-3.5, spark-4.1]
    env:
      NX_DAEMON: 'false'
      OPENIVM_TEST_FORKS: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify native compiler matches the source pin
        shell: bash
        run: |
          set -euo pipefail
          source spark-ext/dev/pins.env
          actual="$("$OPENIVM_CLI_PATH" -init /dev/null -unsigned -noheader -csv -c "LOAD '$OPENIVM_EXTENSION_PATH'; SELECT extension_version FROM duckdb_extensions() WHERE extension_name='openivm';")"
          if [[ ! "$actual" =~ ^[0-9a-f]{7,40}$ || "$OPENIVM_COMMIT" != "$actual"* ]]; then
            echo "Native compiler mismatch: image has $actual; pins.env requires $OPENIVM_COMMIT. Rebuild the devcontainer image."
            exit 1
          fi
          echo "Native compiler matches source pin: $actual"

      - name: Verify
        run: >-
          npx --no-install nx run spark-ext:verify
          --configuration=${{ matrix.target }}
          -- -Dopenivm.test.forks=${OPENIVM_TEST_FORKS}

      - name: Window net-zero probe
        run: >-
          npx --no-install nx run spark-ext:window-benchmark
          --configuration=${{ matrix.target }}

      - name: Upload test inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-inventory-${{ matrix.target }}-${{ github.run_id }}
          path: spark-ext/target/test-inventory/${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.target }}-${{ github.run_id }}
          path: .logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  compare-test-inventory:
    name: Identical test inventory
    needs: verify
    runs-on: [self-hosted, openivm-spark-azure]
    container:
      image: ghcr.io/mdrakiburrahman/openivm-spark-devcontainer:a9bc450e13285b21bb49e973d954538a0fdbe8987ecf2e35cd7c4b60726348bf
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install locked tooling from the warmed cache
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Download test inventories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-inventory-*-${{ github.run_id }}
          path: spark-ext/target/test-inventory
          merge-multiple: true

      - name: Compare discovered tests
        run: npx --no-install nx run spark-ext:compare-test-inventory
