# Test-time logging config for openivm-spark.
#
# Two appenders:
#   * stderr (console) — only WARN+ visible, so the test run shows just
#     scalatest's [info] status lines and any real warnings/errors.
#   * file               — DEBUG+ captured to a per-fork file under
#     ${env:OPENIVM_TEST_LOG_DIR}. `dev.sh` (host) creates the directory
#     and exports OPENIVM_TEST_LOG_DIR=/work/spark-ext/.logs/test-<TS>/
#     before invoking the container so log4j2 can open the file at JVM
#     startup. Each forked test JVM writes its own
#     `fork-<HHmmss-SSS>.log` (via the ${date:...} lookup, resolved once
#     at appender init), so parallel forks never clobber each other.
#
# Spark 3.5 ships log4j2 and otherwise falls back to its built-in
# org/apache/spark/log4j2-defaults.properties (INFO).  By placing this file on
# the test classpath we silence the per-test SparkSession startup log spam.
#
# This file lives in ivm-common/src/test/resources/ and is propagated to the
# test classpath of ivm-compiler, ivm-extension, and ivm-it via the
# "test->test" inter-module sbt dependency chain.
#
# Override locally with -Dlog4j.configurationFile=<path> when debugging.

# Raise log4j2's internal status to `warn` so config-parse errors surface
# on stderr (the default `error` masks the "appender X is null" warnings
# that appear when a filter or lookup is misconfigured). Override to
# `debug` when investigating a "logs are empty" issue.
status = warn
name   = openivm-test-log4j2

# Root threshold must be DEBUG so events reach BOTH appenders. Per-appender
# ThresholdFilters decide what each appender actually emits.
rootLogger.level                    = debug
rootLogger.appenderRef.stderr.ref   = stderr
rootLogger.appenderRef.file.ref     = file

# ── Console appender — WARN+ only (clean console) ────────────────────────────
appender.stderr.type                   = Console
appender.stderr.name                   = stderr
appender.stderr.target                 = SYSTEM_ERR
appender.stderr.filter.threshold.type  = ThresholdFilter
appender.stderr.filter.threshold.level = warn
appender.stderr.layout.type            = PatternLayout
appender.stderr.layout.pattern         = %d{HH:mm:ss.SSS} %-5p %c{1}: %m%n%ex

# ── File appender — DEBUG+ captured for post-mortem investigation ────────────
# `dev.sh setup_test_log_dir` creates ${OPENIVM_TEST_LOG_DIR} on the host
# before invoking docker. The ${date:HHmmss-SSS} lookup resolves at appender
# init in each forked JVM, so the 24-way Test/fork pool produces distinct
# files. Same-millisecond collisions are tolerated (append=true).
appender.file.type = File
appender.file.name = file
# Resolved at appender init time inside each forked test JVM. The chain is:
#   1. `dev.sh setup_test_log_dir` exports OPENIVM_TEST_LOG_DIR=<in-container path>
#   2. `dev.sh run_sbt` adds -Dopenivm.test.log.dir=<same path> to SBT_OPTS
#   3. The sbt JVM picks up sys.props("openivm.test.log.dir")
#   4. `Settings.commonSettings` forwards that as -Dopenivm.test.log.dir
#      into each forked test JVM's javaOptions
#   5. log4j2 in the fork resolves `${sys:openivm.test.log.dir}` here
# Falls back to /tmp/openivm-test-logs when sbt is launched directly
# (e.g. interactive `compose run shell`) without dev.sh in the chain.
appender.file.fileName               = ${sys:openivm.test.log.dir:-/tmp/openivm-test-logs}/fork-${date:HHmmss-SSS}.log
appender.file.append                 = true
appender.file.filter.threshold.type  = ThresholdFilter
appender.file.filter.threshold.level = debug
appender.file.layout.type            = PatternLayout
appender.file.layout.pattern         = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c: %m%n%ex

# Our own code: DEBUG so the file captures the full trace. Console still
# filters to WARN+ via the ThresholdFilter above.
logger.openivm.name  = org.openivm
logger.openivm.level = debug

# Spark / Delta / Hadoop / Parquet are pinned to WARN because their DEBUG
# output is a fire-hose (tens of MB per test) and even INFO is noisy
# enough to make the test-fork log files unreadable. These levels apply
# to BOTH appenders (logger-level filters fire BEFORE any appender sees
# the event), so they also cap what reaches the per-fork file.
#
# To investigate a Spark / Delta issue, crank a specific logger via
# -D at sbt launch, e.g.
#   ./spark-ext/dev/dev.sh test '-Dlog4j2.logger.org.apache.spark=debug' \
#                               'testOnly …'
logger.spark.name          = org.apache.spark
logger.spark.level         = warn
logger.sparkproject.name   = org.sparkproject
logger.sparkproject.level  = warn
logger.delta.name          = io.delta
logger.delta.level         = warn
logger.hadoop.name         = org.apache.hadoop
logger.hadoop.level        = warn
logger.parquet.name        = org.apache.parquet
logger.parquet.level       = warn
logger.parquetHadoop.name  = parquet
logger.parquetHadoop.level = warn
logger.hive.name           = org.apache.hive
logger.hive.level          = warn
logger.orc.name            = org.apache.orc
logger.orc.level           = warn

# Silence the chatty native-code library warning that triggers on every JVM.
logger.nativeCode.name  = org.apache.hadoop.util.NativeCodeLoader
logger.nativeCode.level = error

# RetryPolicy emits per-attempt WARN/INFO/ERROR for every retryable error.
# Tests that DELIBERATELY exhaust the retry budget (RetryPolicySpec /
# SparkSessionRetryExtensionsSpec / ConcurrencySpec stress cases) emit a
# stack trace per retry that clutters every test run; the test outcome
# is asserted via the thrown exception, so the log is pure noise on a
# green run. Silence it here — failing tests still surface the cause
# through scalatest's standard reporting.
logger.retryPolicy.name  = org.openivm.spark.common.RetryPolicy
logger.retryPolicy.level = off

# Delta's MergeIntoCommand logs ConcurrentAppendException at ERROR with a
# full stack trace BEFORE Delta's own internal retry / our RetryPolicy
# wrapper catches and retries. Identical stack repeats on every conflict —
# the test outcome is decided by the final exception or by RetryPolicy
# success, so the intermediate ERROR is pure noise.
logger.deltaMergeIntoCommand.name  = org.apache.spark.sql.delta.commands.MergeIntoCommand
logger.deltaMergeIntoCommand.level = off

# Delta's OptimisticTransaction logs WARN ("Concurrent…", "Transaction
# attempt failed", "Retrying transaction") on every conflict before
# bubbling the exception up to MergeIntoCommand and our retry layer.
logger.deltaOptimisticTxn.name  = org.apache.spark.sql.delta.OptimisticTransaction
logger.deltaOptimisticTxn.level = error

# Spark's WindowExec WARNs on every window operation without an explicit
# PARTITION BY ("No Partition Defined for Window operation! Moving all
# data to a single partition…"). Local[*] tests use 1-partition data on
# purpose; the warning is correct but redundant in tests.
logger.windowExec.name  = org.apache.spark.sql.execution.window.WindowExec
logger.windowExec.level = error

# Executor heartbeat timeouts ("Issue communicating with driver in
# heartbeater") are spurious in local[*] mode under load — the executor
# and driver share a JVM, so the "timeout" is just the executor scheduler
# being preempted while a long-running task runs. Same story for the
# corresponding NettyRpcEnv "Ignored failure" warnings.
logger.executor.name     = org.apache.spark.executor.Executor
logger.executor.level    = error
logger.nettyRpcEnv.name  = org.apache.spark.rpc.netty.NettyRpcEnv
logger.nettyRpcEnv.level = error

# Delta snapshot lineage prints at INFO on every commit; keep at ERROR in tests.
logger.deltaSnapshot.name   = org.apache.spark.sql.delta.Snapshot
logger.deltaSnapshot.level  = error

# SparkStringUtils truncates long plan toString output and warns on every truncation.
# Plan-string truncation is irrelevant in tests; silence the warn.
logger.sparkStringUtils.name  = org.apache.spark.sql.catalyst.util.SparkStringUtils
logger.sparkStringUtils.level = error
# Some Spark 3.5 builds also expose it under org.apache.spark.util.Utils.
logger.sparkUtils.name  = org.apache.spark.util.Utils
logger.sparkUtils.level = error
