# Test-time logging config for openivm-spark.
#
# Spark 3.5 ships log4j2 and otherwise falls back to its built-in
# org/apache/spark/log4j2-defaults.properties (INFO).  By placing this file on
# the test classpath we silence the per-test SparkSession startup log spam.
#
# This file lives in ivm-common/src/test/resources/ and is propagated to the
# test classpath of ivm-compiler, ivm-extension, and ivm-it via the
# "test->test" inter-module sbt dependency chain.
#
# Override locally with -Dlog4j.configurationFile=<path> when debugging.

status = error
name   = openivm-test-log4j2

rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = stderr

appender.stderr.type           = Console
appender.stderr.name           = stderr
appender.stderr.target         = SYSTEM_ERR
appender.stderr.layout.type    = PatternLayout
appender.stderr.layout.pattern = %d{HH:mm:ss.SSS} %-5p %c{1}: %m%n%ex

# Our own code stays at INFO so test diagnostics remain visible.
logger.openivm.name  = org.openivm
logger.openivm.level = info

# Spark's startup is the loudest source; pin its families to WARN.
logger.spark.name             = org.apache.spark
logger.spark.level            = warn
logger.sparkproject.name      = org.sparkproject
logger.sparkproject.level     = warn
logger.delta.name             = io.delta
logger.delta.level            = warn
logger.hadoop.name            = org.apache.hadoop
logger.hadoop.level           = warn
logger.parquet.name           = org.apache.parquet
logger.parquet.level          = warn
logger.parquetHadoop.name     = parquet
logger.parquetHadoop.level    = warn
logger.hive.name              = org.apache.hive
logger.hive.level             = warn
logger.orc.name               = org.apache.orc
logger.orc.level              = warn

# Silence the chatty native-code library warning that triggers on every JVM.
logger.nativeCode.name      = org.apache.hadoop.util.NativeCodeLoader
logger.nativeCode.level     = error

# Delta snapshot lineage prints at INFO on every commit; keep at ERROR in tests.
logger.deltaSnapshot.name   = org.apache.spark.sql.delta.Snapshot
logger.deltaSnapshot.level  = error

# SparkStringUtils truncates long plan toString output and warns on every truncation.
# Plan-string truncation is irrelevant in tests; silence the warn.
logger.sparkStringUtils.name  = org.apache.spark.sql.catalyst.util.SparkStringUtils
logger.sparkStringUtils.level = error
# Some Spark 3.5 builds also expose it under org.apache.spark.util.Utils.
logger.sparkUtils.name        = org.apache.spark.util.Utils
logger.sparkUtils.level       = error
