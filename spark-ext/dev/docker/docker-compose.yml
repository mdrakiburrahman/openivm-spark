# docker-compose.yml for the openivm-spark dev loop.
#
#   build       → sbt compile + sbt assembly (spark-ext stage)
#   test        → sbt test (spark-ext stage, all suites)
#   it          → sbt ivm-it/test (integration suites only)
#   shell       → interactive bash inside spark-ext stage
#   fmt         → sbt scalafmtAll
#   openivm-test→ runs `make test` inside the openivm-tester stage; verifies the
#                 upstream OpenIVM sqllogictest suite (including our patches)
#
# Tweak SHAs / versions via dev/pins.env. The build args are read from there.

x-spark-ext: &spark-ext
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: spark-ext
    args:
      OPENIVM_REPO: ${OPENIVM_REPO}
      OPENIVM_BRANCH: ${OPENIVM_BRANCH}
      OPENIVM_COMMIT: ${OPENIVM_COMMIT}
      LPTS_REPO: ${LPTS_REPO}
      LPTS_BRANCH: ${LPTS_BRANCH}
      LPTS_COMMIT: ${LPTS_COMMIT}
      DUCKDB_REF: ${DUCKDB_REF}
      DUCKDB_COMMIT: ${DUCKDB_COMMIT}
      NATIVE_BUILD_JOBS: ${NATIVE_BUILD_JOBS:-8}
      OPENIVM_SPARK_TARGET: ${OPENIVM_SPARK_TARGET}
      JDK_VERSION: ${JDK_VERSION}
      SBT_VERSION: ${SBT_VERSION}
      SCALA_VERSION: ${SCALA_VERSION}
      DUCKDB_JDBC_VERSION: ${DUCKDB_JDBC_VERSION}
      UBUNTU_MIRROR: ${UBUNTU_MIRROR}
  image: openivm-spark/spark-ext:${SPARK_EXT_IMAGE_TAG}
  volumes:
    # ${SPARK_EXT_DEV_HOST_DIR} / ${SPARK_EXT_HOST_DIR} are exported by
    # dev.sh (see resolve_host_repo_root) so these resolve correctly whether
    # the Docker daemon is local (bare host) or reached via a devcontainer's
    # forwarded socket, where the plain relative paths would otherwise be
    # resolved against the daemon's own unrelated filesystem.
    - ${SPARK_EXT_DEV_HOST_DIR:-..}:/work/spark-ext-dev:ro
    - ${SPARK_EXT_HOST_DIR:-../..}:/work/spark-ext:rw
    - sbt-cache:/root/.sbt
    - ivy-cache:/root/.ivy2
    - coursier-cache:/root/.cache/coursier
  working_dir: /work/spark-ext
  environment:
    OPENIVM_SPARK_TARGET: ${OPENIVM_SPARK_TARGET}
    OPENIVM_NATIVE_DIR: /opt/openivm
    SBT_OPTS: "-Xmx4G -XX:+UseG1GC -Dsbt.color=always -Dfile.encoding=UTF-8"
    # Test-log directory inside the container, mirroring the host's
    # repo-root/.logs/test-<TS>/ layout. `dev.sh` (host) sets this env
    # var on each `test` / `verify` invocation; log4j2.properties uses
    # ${env:OPENIVM_TEST_LOG_DIR} to route per-fork DEBUG logs.
    # Defaults to /tmp/openivm-test-logs when unset (interactive
    # `compose run` without dev.sh) so log4j2 doesn't fail to open.
    OPENIVM_TEST_LOG_DIR: ${OPENIVM_TEST_LOG_DIR:-/tmp/openivm-test-logs}

services:
  build:
    <<: *spark-ext
    command: ["sbt", "compile"]

  assembly:
    <<: *spark-ext
    command: ["sbt", "ivmExtension/assembly"]

  test:
    <<: *spark-ext
    command: ["sbt", "test"]

  it:
    <<: *spark-ext
    command: ["sbt", "ivmIt/test"]

  shell:
    <<: *spark-ext
    stdin_open: true
    tty: true
    command: ["bash"]

  fmt:
    <<: *spark-ext
    command: ["sbt", "scalafmtAll", "scalafmtSbt"]

  openivm-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: openivm-tester
      args:
        OPENIVM_REPO: ${OPENIVM_REPO}
        OPENIVM_BRANCH: ${OPENIVM_BRANCH}
        OPENIVM_COMMIT: ${OPENIVM_COMMIT}
        LPTS_REPO: ${LPTS_REPO}
        LPTS_BRANCH: ${LPTS_BRANCH}
        LPTS_COMMIT: ${LPTS_COMMIT}
        DUCKDB_REF: ${DUCKDB_REF}
        DUCKDB_COMMIT: ${DUCKDB_COMMIT}
        NATIVE_BUILD_JOBS: ${NATIVE_BUILD_JOBS:-8}
        UBUNTU_MIRROR: ${UBUNTU_MIRROR}
    image: openivm-spark/openivm-tester:${OPENIVM_COMMIT}-${LPTS_COMMIT}-${DUCKDB_REF}
    command: ["make", "test"]

volumes:
  sbt-cache:
  ivy-cache:
  coursier-cache:
